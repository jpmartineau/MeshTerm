blank_issues_enabled: false
contact_links:
  - name: Not sure it is a bug? Ask on Discord
    url: https://discord.gg/AZwe5Uvb3S
    about: >
      Use Discord for a problem with the setup, for the question "is it correct that it does
      this", or when you want a second opinion. The #support forum is the correct place.
      Probably someone who runs your radio had the same problem.

  - name: "No GitHub account? Report it in the #bugs forum instead"
    url: https://discord.gg/AZwe5Uvb3S
    about: >
      Make one post for each bug. Add a tag, and attach the diagnostics file. I open an issue
      here for each real bug, and I rename your post with the number of the issue. Thus you can
      follow it without an account. You also get a message when the correction is released.
      It is better that you tell us about a bug than that you file it in a tidy way.
